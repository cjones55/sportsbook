services:
  - type: web
    name: sportsbook
    runtime: node
    plan: starter
    buildCommand: "true"
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ODDS_API_KEY
        sync: false
    disk:
      name: sportsbook-data
      mountPath: /var/data
      sizeGB: 1
